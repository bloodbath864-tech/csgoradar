<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Radar</title>
</head>
<body style="background:#222;margin:0;overflow:hidden;">
    <img src="" id="map" width="512" height="512" style="position:absolute;">
    <canvas id="radar" width="512" height="512" style="z-index:1000;position:relative;" />
</body>
<script>
    const ws = new WebSocket("ws://" + window.location.hostname + ":6969");
    const canvas = document.getElementById("radar");
    const ctx = canvas.getContext("2d");
    const map = document.getElementById("map");

    let pos_x, pos_y, scale, prev_map_name;
    const ratio = 0.5;

    function update_map_data() {
        fetch("/data/" + prev_map_name).then((res) => res.json()).then((data) => {
            pos_x = data.pos_x;
            pos_y = data.pos_y;
            scale = data.scale;
        });
    }

    let healths = [], x_positions = [], y_positions = [], teams = [], last_places = [], is_sound = [];

    ws.onopen = () => {
        console.log("WebSocket connected to server");
    };

    ws.onerror = (error) => {
        console.error("WebSocket error:", error);
    };

    ws.onclose = () => {
        console.log("WebSocket disconnected");
    };

    ws.onmessage = (e) => {
        try {
            // Handle Blob data from WebSocket
            if (e.data instanceof Blob) {
                e.data.text().then(text => {
                    console.log("Received text from Blob:", text.substring(0, 100));
                    const obj = JSON.parse(text);
                    processGameData(obj);
                });
            } else {
                // Handle string data
                console.log("Received data:", e.data.substring(0, 100));
                const obj = JSON.parse(e.data);
                processGameData(obj);
            }
        } catch(err) {
            console.error("Failed to parse message:", err);
            console.error("Data type:", typeof e.data);
            console.error("Raw data:", e.data);
        }
    };

    function processGameData(obj) {
        console.log("Parsed object:", obj);
        
        if (prev_map_name != obj.map_name) {
            prev_map_name = obj.map_name;
            console.log("Map changed to:", prev_map_name);
            map.src = "/data/images/" + prev_map_name + "_radar.png";
            update_map_data();
        } 
        healths = obj.healths;
        x_positions = obj.x_positions;
        y_positions = obj.y_positions;
        teams = obj.teams;
        last_places = obj.last_places;
        is_sound = obj.is_sound || [];
    }

    let soundPingTimer = 0;

    setInterval(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        soundPingTimer = (soundPingTimer + 0.1) % (Math.PI * 2);

        for (const i in healths) {
            const mapped_x = ((x_positions[i] - pos_x) / scale) * ratio;
            const mapped_y = ((y_positions[i] - pos_y) / -scale) * ratio;

            const isSoundPing = is_sound[i];

            // Цвет в зависимости от команды: 2 = Red (T), 3 = Blue (CT)
            if (teams[i] === 2) {
                ctx.fillStyle = "#ff4444"; // Террористы
            } else if (teams[i] === 3) {
                ctx.fillStyle = "#4444ff"; // Контр-террористы
            } else {
                ctx.fillStyle = "#ffffff";
            }

            if (isSoundPing) {
                // Рисуем пульсирующий круг для звуковых меток
                const pulse = Math.abs(Math.sin(soundPingTimer * 2)) * 5 + 3;
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.arc(mapped_x, mapped_y, pulse + 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                // Для звуковых меток рисуем крестик вместо круга
                ctx.strokeStyle = ctx.fillStyle;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(mapped_x - 4, mapped_y - 4);
                ctx.lineTo(mapped_x + 4, mapped_y + 4);
                ctx.moveTo(mapped_x + 4, mapped_y - 4);
                ctx.lineTo(mapped_x - 4, mapped_y + 4);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(mapped_x, mapped_y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "white";
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            ctx.fillStyle = "white";
            ctx.font = "10px sans-serif";
            ctx.fillText(last_places[i] || "", mapped_x + 7, mapped_y + 3);
        }
    }, 33);
</script>
</html>
